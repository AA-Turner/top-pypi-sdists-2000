[project]
name = "connectrpc"
version = "0.13.0"
description = "Server and client runtime library for Connect RPC"
readme = "README.md"
requires-python = ">= 3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "connect",
    "grpc",
    "http",
    "protobuf",
    "rpc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "protobuf-py>=0.6.0",
    "pyqwest>=0.12.0",
    "typing_extensions>=4.16.0",
]

[[project.maintainers]]
name = "Anuraag Agrawal"
email = "anuraaga@gmail.com"

[[project.maintainers]]
name = "Spencer Nelson"
email = "spencer@firetiger.com"

[[project.maintainers]]
name = "Stefan VanBuren"
email = "stefan@vanburen.xyz"

[[project.maintainers]]
name = "Yasushi Itoh"
email = "i2y.may.roku@gmail.com"

[project.urls]
Documentation = "https://connectrpc.com/docs/python/getting-started/"
Homepage = "https://github.com/connectrpc/connect-py"
Issues = "https://github.com/connectrpc/connect-py/issues"
Repository = "https://github.com/connectrpc/connect-py"

[dependency-groups]
dev = [
    { include-group = "test" },
    "connectrpc-grpcreflect",
    "connectrpc-otel",
    "protoc-gen-connectrpc",
    "buf-bin==1.74.0",
    "granian==2.8.4",
    "gunicorn==26.2.0",
    "poethepoet==0.49.0",
    "pytest-cov==7.1.0",
    "pyvoy==1.3.0",
    "ruff==0.17.1",
    "tombi==1.8.8",
    "ty==0.0.89",
    "types-grpcio==1.84.0.20260928",
    "types-protobuf==7.35.1.20260906",
    "uvicorn==0.54.0",
    "opentelemetry-instrumentation-asgi==0.66b1",
    "opentelemetry-instrumentation-wsgi==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "protoc-gen-grpc-py==0.4.0",
    "protoc-gen-py==0.7.0",
]
test = [
    "example",
    "asgiref==3.12.1",
    "brotli==1.2.0",
    "hypercorn==0.18.0",
    "protobuf>=5.28",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout==2.5.0",
    "trio==0.34.0",
    "zstandard==0.25.0",
]
docs = [
    "mkdocstrings-python==2.0.9",
    "zensical==0.0.71",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest]
filterwarnings = [
    "error",
    "ignore:SelectableGroups dict interface is deprecated. Use select.",
]
strict = true
testpaths = ["test"]
timeout = 1800

[tool.ruff]
extend-exclude = [
    "*_pb2.py",
    "*_pb2.pyi",
]

[tool.ruff.format]
skip-magic-trailing-comma = true
docstring-code-format = true

[tool.ruff.lint]
typing-extensions = true
select = ["ALL"]
ignore = [
    "W191",
    "E111",
    "E114",
    "E117",
    "E501",
    "D206",
    "D300",
    "Q",
    "COM812",
    "COM819",
    "CPY001",
    "TRY301",
    "SLF001",
    "ANN401",
    "PLR2004",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0916",
    "PLR0917",
    "PLR1702",
    "PT012",
    "TD",
    "FIX002",
]

[tool.ruff.lint.per-file-ignores]
"conformance/test/**" = [
    "ANN",
    "BLE",
    "INP",
    "SLF",
    "SIM115",
    "S101",
    "D",
]
"example/**" = [
    "ANN",
    "S",
    "T20",
    "D",
]
"**/test/*.py" = [
    "ANN",
    "S101",
    "S603",
    "S607",
    "FBT",
    "EM",
    "INP",
    "SLF",
    "PERF",
    "D",
]
"**/*_grpc.py" = [
    "N",
    "FBT",
]

[tool.ruff.lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[tool.ty.src]
exclude = [
    "**/*_pb2_grpc.py",
    "connectrpc-grpcreflect",
    "connectrpc-otel",
    "example",
]

[tool.ty.environment]
extra-paths = ["conformance/test"]

[tool.uv.build-backend]
module-name = "connectrpc"

[tool.uv.workspace]
members = [
    "connectrpc-grpcreflect",
    "connectrpc-otel",
    "example",
    "protoc-gen-connectrpc",
]

[tool.uv.sources.connectrpc]
workspace = true

[tool.uv.sources.connectrpc-grpcreflect]
workspace = true

[tool.uv.sources.connectrpc-otel]
workspace = true

[tool.uv.sources.protoc-gen-connectrpc]
workspace = true

[tool.uv.sources.example]
workspace = true
