[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-jsonschema"
version = "4.26.0.20261006"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for jsonschema"
readme = { text = """\
## Typing stubs for jsonschema

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`jsonschema`](https://github.com/python-jsonschema/jsonschema) package. It can be used by type checkers
to check code that uses `jsonschema`. This version of
`types-jsonschema` aims to provide accurate annotations for
`jsonschema~=4.26.0`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/jsonschema`](https://github.com/python/typeshed/tree/main/stubs/jsonschema)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.3.1
* [pyrefly](https://pyrefly.org/) 1.3.2
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.84

It was generated from typeshed commit
[`0b28ac87099d7e3d40612e07ed104ef98143bbe6`](https://github.com/python/typeshed/commit/0b28ac87099d7e3d40612e07ed104ef98143bbe6).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['referencing']



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/jsonschema.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['jsonschema-stubs']
include-package-data = false

[tool.setuptools.package-data]
'jsonschema-stubs' = ['__init__.pyi', '_format.pyi', '_keywords.pyi', '_legacy_keywords.pyi', '_types.pyi', '_typing.pyi', '_utils.pyi', 'cli.pyi', 'exceptions.pyi', 'protocols.pyi', 'validators.pyi', 'METADATA.toml', 'py.typed']
