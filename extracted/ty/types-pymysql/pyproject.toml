[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-PyMySQL"
version = "1.2.4.20261111"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for PyMySQL"
readme = { text = """\
## Typing stubs for PyMySQL

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`PyMySQL`](https://github.com/PyMySQL/PyMySQL) package. It can be used by type checkers
to check code that uses `PyMySQL`. This version of
`types-PyMySQL` aims to provide accurate annotations for
`PyMySQL~=1.2.4`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/PyMySQL`](https://github.com/python/typeshed/tree/main/stubs/PyMySQL)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.4.1
* [pyrefly](https://pyrefly.org/) 1.4.0
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.95

It was generated from typeshed commit
[`7f0dcd5e88baf0d30047bda21f5954ca10235c19`](https://github.com/python/typeshed/commit/7f0dcd5e88baf0d30047bda21f5954ca10235c19).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/PyMySQL.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['pymysql-stubs']
include-package-data = false

[tool.setuptools.package-data]
'pymysql-stubs' = ['__init__.pyi', '_auth.pyi', 'charset.pyi', 'connections.pyi', 'constants/CLIENT.pyi', 'constants/COMMAND.pyi', 'constants/CR.pyi', 'constants/ER.pyi', 'constants/FIELD_TYPE.pyi', 'constants/FLAG.pyi', 'constants/SERVER_STATUS.pyi', 'constants/__init__.pyi', 'converters.pyi', 'cursors.pyi', 'err.pyi', 'optionfile.pyi', 'protocol.pyi', 'times.pyi', 'METADATA.toml', 'py.typed']
