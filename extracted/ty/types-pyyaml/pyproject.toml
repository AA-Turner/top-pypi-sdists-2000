[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-PyYAML"
version = "6.0.12.20260724"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for PyYAML"
readme = { text = """\
## Typing stubs for PyYAML

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`PyYAML`](https://github.com/yaml/pyyaml) package. It can be used by type checkers
to check code that uses `PyYAML`. This version of
`types-PyYAML` aims to provide accurate annotations for
`PyYAML==6.0.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/PyYAML`](https://github.com/python/typeshed/tree/main/stubs/PyYAML)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.3.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411

It was generated from typeshed commit
[`97e83f65cee88c0c978fa34668d9f59b8c362fce`](https://github.com/python/typeshed/commit/97e83f65cee88c0c978fa34668d9f59b8c362fce).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/PyYAML.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['yaml-stubs']
include-package-data = false

[tool.setuptools.package-data]
'yaml-stubs' = ['__init__.pyi', '_yaml.pyi', 'composer.pyi', 'constructor.pyi', 'cyaml.pyi', 'dumper.pyi', 'emitter.pyi', 'error.pyi', 'events.pyi', 'loader.pyi', 'nodes.pyi', 'parser.pyi', 'reader.pyi', 'representer.pyi', 'resolver.pyi', 'scanner.pyi', 'serializer.pyi', 'tokens.pyi', 'METADATA.toml', 'py.typed']
