[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-html5lib"
version = "1.1.11.20260402"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for html5lib"
readme = { text = """\
## Typing stubs for html5lib

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`html5lib`](https://github.com/html5lib/html5lib-python) package. It can be used by type checkers
to check code that uses `html5lib`. This version of
`types-html5lib` aims to provide accurate annotations for
`html5lib==1.1.*`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/html5lib`](https://github.com/python/typeshed/tree/main/stubs/html5lib)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 1.20.0
* [pyright](https://github.com/microsoft/pyright) 1.1.408

It was generated from typeshed commit
[`4ab04d22631e5842838528ceaae19c3c532cdd43`](https://github.com/python/typeshed/commit/4ab04d22631e5842838528ceaae19c3c532cdd43).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = ['types-webencodings']

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/html5lib.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['html5lib-stubs']
include-package-data = false

[tool.setuptools.package-data]
'html5lib-stubs' = ['__init__.pyi', '_ihatexml.pyi', '_inputstream.pyi', '_tokenizer.pyi', '_trie/__init__.pyi', '_trie/_base.pyi', '_trie/py.pyi', '_utils.pyi', 'constants.pyi', 'filters/__init__.pyi', 'filters/alphabeticalattributes.pyi', 'filters/base.pyi', 'filters/inject_meta_charset.pyi', 'filters/lint.pyi', 'filters/optionaltags.pyi', 'filters/sanitizer.pyi', 'filters/whitespace.pyi', 'html5parser.pyi', 'serializer.pyi', 'treeadapters/__init__.pyi', 'treeadapters/genshi.pyi', 'treeadapters/sax.pyi', 'treebuilders/__init__.pyi', 'treebuilders/base.pyi', 'treebuilders/dom.pyi', 'treebuilders/etree.pyi', 'treebuilders/etree_lxml.pyi', 'treewalkers/__init__.pyi', 'treewalkers/base.pyi', 'treewalkers/dom.pyi', 'treewalkers/etree.pyi', 'treewalkers/etree_lxml.pyi', 'treewalkers/genshi.pyi', 'METADATA.toml', 'py.typed']
