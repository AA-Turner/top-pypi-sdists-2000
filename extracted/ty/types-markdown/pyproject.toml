[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-Markdown"
version = "3.11.2.20261029"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for Markdown"
readme = { text = """\
## Typing stubs for Markdown

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`Markdown`](https://github.com/Python-Markdown/markdown) package. It can be used by type checkers
to check code that uses `Markdown`. This version of
`types-Markdown` aims to provide accurate annotations for
`Markdown~=3.11.2`.

This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/Markdown`](https://github.com/python/typeshed/tree/main/stubs/Markdown)
directory.

This package was tested with the following type checkers:
* [mypy](https://www.mypy-lang.org/) 2.4.0
* [pyrefly](https://pyrefly.org/) 1.4.0
* [pyright](https://microsoft.github.io/pyright/) 1.1.414
* [ty](https://docs.astral.sh/ty/) 0.0.90

It was generated from typeshed commit
[`d3fe4dd2f928b33aa50d347a21ea30a8c9c9811e`](https://github.com/python/typeshed/commit/d3fe4dd2f928b33aa50d347a21ea30a8c9c9811e).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []



[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/Markdown.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['markdown-stubs']
include-package-data = false

[tool.setuptools.package-data]
'markdown-stubs' = ['__init__.pyi', '__main__.pyi', '__meta__.pyi', 'blockparser.pyi', 'blockprocessors.pyi', 'core.pyi', 'extensions/__init__.pyi', 'extensions/abbr.pyi', 'extensions/admonition.pyi', 'extensions/attr_list.pyi', 'extensions/codehilite.pyi', 'extensions/def_list.pyi', 'extensions/extra.pyi', 'extensions/fenced_code.pyi', 'extensions/footnotes.pyi', 'extensions/legacy_attrs.pyi', 'extensions/legacy_em.pyi', 'extensions/md_in_html.pyi', 'extensions/meta.pyi', 'extensions/nl2br.pyi', 'extensions/sane_lists.pyi', 'extensions/smarty.pyi', 'extensions/tables.pyi', 'extensions/toc.pyi', 'extensions/wikilinks.pyi', 'htmlparser.pyi', 'inlinepatterns.pyi', 'postprocessors.pyi', 'preprocessors.pyi', 'serializers.pyi', 'test_tools.pyi', 'treeprocessors.pyi', 'util.pyi', 'METADATA.toml', 'py.typed']
