[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=82.0.1"]

[project]
name = "types-cachetools"
version = "7.0.0.20260713"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Typing stubs for cachetools"
readme = { text = """\
## Typing stubs for cachetools

This is a [type stub package](https://typing.python.org/en/latest/tutorials/external_libraries.html)
for the [`cachetools`](https://github.com/tkem/cachetools) package. It can be used by type checkers
to check code that uses `cachetools`. This version of
`types-cachetools` aims to provide accurate annotations for
`cachetools==7.0.*`.

*Note:* The `cachetools` package includes type annotations or type stubs
since version 7.1.0. Please uninstall the `types-cachetools`
package if you use this or a newer version.


This package is part of the [typeshed project](https://github.com/python/typeshed).
All fixes for types and metadata should be contributed there.
See [the README](https://github.com/python/typeshed/blob/main/README.md)
for more details. The source for this package can be found in the
[`stubs/cachetools`](https://github.com/python/typeshed/tree/main/stubs/cachetools)
directory.

This package was tested with the following type checkers:
* [mypy](https://github.com/python/mypy/) 2.2.0
* [pyright](https://github.com/microsoft/pyright) 1.1.411

It was generated from typeshed commit
[`af0c7e69534ff3ae810d06b727f5ac190b091927`](https://github.com/python/typeshed/commit/af0c7e69534ff3ae810d06b727f5ac190b091927).
""", content-type = "text/markdown" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Stubs Only",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/python/typeshed"
"GitHub" = "https://github.com/python/typeshed"
"Changes" = "https://github.com/typeshed-internal/stub_uploader/blob/main/data/changelogs/cachetools.md"
"Issue tracker" = "https://github.com/python/typeshed/issues"
"Chat" = "https://gitter.im/python/typing"

[tool.setuptools]
packages = ['cachetools-stubs']
include-package-data = false

[tool.setuptools.package-data]
'cachetools-stubs' = ['__init__.pyi', 'func.pyi', 'keys.pyi', 'METADATA.toml', 'py.typed']
