[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "narwhals"
version = "2.25.0"
dependencies = []
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
description = "Extremely lightweight compatibility layer between dataframe libraries"
readme = "README.md"
keywords = [
    "dataframes",
    "interoperability",
    "pandas",
    "polars",
    "pyarrow",
    "dask",
    "modin",
    "cudf",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Typing :: Typed",
]

[[project.authors]]
name = "Marco Gorelli"
email = "hello_narwhals@proton.me"

[project.urls]
Homepage = "https://github.com/narwhals-dev/narwhals"
Documentation = "https://narwhals-dev.github.io/narwhals/"
Repository = "https://github.com/narwhals-dev/narwhals"
"Bug Tracker" = "https://github.com/narwhals-dev/narwhals/issues"

[project.optional-dependencies]
pandas = ["pandas>=1.3.4"]
modin = ["modin>=0.22.0"]
cudf = ["cudf-cu12>=24.10.0; sys_platform == 'linux'"]
pyarrow = ["pyarrow>=13.0.0"]
pyspark = ["pyspark>=3.5.0"]
pyspark-connect = ["pyspark[connect]>=3.5.0"]
polars = ["polars>=0.20.4"]
dask = ["dask[dataframe]>=2024.8"]
duckdb = ["duckdb>=1.1"]
ibis = [
    "ibis-framework>=6.0.0",
    "packaging>=21.3",
    "pyarrow_hotfix>=0.7",
]
sqlframe = ["sqlframe>=3.22.0,!=3.39.3"]
sql = [
    "narwhals[duckdb]",
    "sqlparse>=0.5.5",
]

[dependency-groups]
core = [
    "pandas>=1.3.4",
    "duckdb>=1.5",
    "narwhals[duckdb,polars,pyarrow,sqlframe,sql]",
]
plugins = ["test-plugin"]
tests = [
    "covdefaults",
    "pytest>=9.0.3",
    "pytest-cov",
    "pytest-env",
    "pytest-randomly",
    "pytest-xdist",
    "hypothesis>=6.0.0",
]
sklearn = ["scikit-learn"]
typing = [
    "mypy>=2.1.0",
    "pyrefly>=1.2.0",
    "pyright",
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pandas-stubs>=2.3.0.250703",
    "pyarrow-stubs>=19.2",
    "rich>=12.4.4",
    "typing-extensions>=4.15.0",
    "narwhals[dask,duckdb,ibis,pandas,polars,pyarrow,sql,sqlframe]",
    { include-group = "plugins" },
]
docs = [
    "jinja2>=3.1.6",
    "markdown-exec[ansi]>=1.12.1",
    "mkdocs-autorefs>=1.4.4",
    "mkdocstrings-python>=2.0.3",
    "pandas>=1.3.4",
    "narwhals[duckdb,pyarrow,polars,sql,sqlframe]",
    "ruff",
    "zensical>=0.0.38",
]
dev = [
    "prek",
    "ruff",
    { include-group = "tests" },
]
extreme-minimum-versions = [
    "setuptools",
    "tzdata",
    "pandas==1.3.4",
    "polars==0.20.4",
    "numpy==1.21.4",
    "pyarrow==13.0.0",
    "pyarrow-stubs<17",
    "scipy==1.7.3",
    "scikit-learn==1.1.0",
    "duckdb==1.1",
    { include-group = "tests" },
]
extreme-pretty-old-versions = [
    "setuptools",
    "tzdata",
    "pandas==1.4.1",
    "polars==0.20.4",
    "numpy==1.22.0",
    "pyarrow==14.0.0",
    "pyarrow-stubs<17",
    "scipy==1.8.0",
    "scikit-learn==1.1.0",
    "duckdb==1.2",
    { include-group = "tests" },
]
extreme-not-so-old-versions = [
    "setuptools",
    "tzdata",
    "pandas==2.0.3",
    "polars==0.20.8",
    "numpy==1.24.4",
    "pyarrow==15.0.0",
    "pyarrow-stubs<17",
    "scipy==1.8.0",
    "scikit-learn==1.3.0",
    "duckdb==1.3",
    "dask[dataframe]==2024.10",
    { include-group = "tests" },
]
min-pyspark-version = [
    "pyspark==3.5.0",
    { include-group = "core-tests" },
]

[[dependency-groups.dev-core]]
include-group = "dev"

[[dependency-groups.dev-core]]
include-group = "core"

[[dependency-groups.core-tests]]
include-group = "core"

[[dependency-groups.core-tests]]
include-group = "tests"

[[dependency-groups.local-dev]]
include-group = "dev"

[[dependency-groups.local-dev]]
include-group = "core"

[[dependency-groups.local-dev]]
include-group = "docs"

[[dependency-groups.local-dev]]
include-group = "plugins"

[tool.uv]
conflicts = [
    [
    { extra = "cudf" },
    { extra = "modin" },
    { extra = "pandas" },
],
    [
    { extra = "cudf" },
    { group = "typing" },
    { group = "extreme-minimum-versions" },
    { group = "extreme-not-so-old-versions" },
    { group = "extreme-pretty-old-versions" },
],
    [
    { extra = "cudf" },
    { extra = "dask" },
    { extra = "modin" },
    { group = "extreme-minimum-versions" },
    { group = "extreme-pretty-old-versions" },
],
    [
    { group = "core" },
    { group = "extreme-minimum-versions" },
    { group = "extreme-not-so-old-versions" },
    { group = "extreme-pretty-old-versions" },
],
]

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources.test-plugin]
workspace = true

[tool.ruff]
line-length = 90
fix = true
target-version = "py310"
extend-exclude = ["**/this.py"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
typing-modules = ["narwhals._typing_compat"]
extend-safe-fixes = [
    "C419",
    "C420",
    "EM101",
    "EM102",
    "PLR6201",
    "TC",
    "UP",
    "PLW1514",
]
extend-select = [
    "PLR0914",
    "PLR0916",
    "PLR1702",
    "PLR6201",
    "PLW1514",
]
select = ["ALL"]
ignore = [
    "A001",
    "A004",
    "ARG002",
    "ANN401",
    "CPY001",
    "COM812",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "DTZ001",
    "E501",
    "FBT003",
    "FIX",
    "PD010",
    "PLC0415",
    "PLR0913",
    "PLR2004",
    "PLW1641",
    "SLF001",
    "TD003",
    "TD004",
]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["format"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "Series",
    "DataFrame",
    "_Window",
    "F",
    "_F",
]

[tool.ruff.lint.per-file-ignores]
"src/narwhals/expr_dt.py" = ["RUF002"]
"src/narwhals/typing.py" = ["PYI042"]
"src/narwhals/_*/utils.py" = ["PLR0911"]
"tests/*" = [
    "S101",
    "C901",
    "PLR0912",
    "PLR0916",
    "PLR0917",
]
"tpch/tests/*" = ["S101"]
"tpch/execute/*" = ["T201"]
"tpch/queries/*" = ["PLR0917"]
"tpch/notebooks/*" = [
    "ANN001",
    "ANN201",
    "EM101",
    "EXE002",
    "PTH123",
    "T203",
    "TRY003",
]
"utils/*" = [
    "S311",
    "T201",
]
"utils/bump_version.py" = [
    "S603",
    "S607",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "src/narwhals/_*",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "error",
    "ignore:.*defaulting to pandas implementation:Warning:modin",
    "ignore:.*implementation has mismatches with pandas:Warning:modin",
    "ignore:.*You are using pyarrow version",
    'ignore:.*fetch_arrow_table\(\) is deprecated:DeprecationWarning:sqlframe',
    'ignore:.*fetch_arrow_table\(\) is deprecated:DeprecationWarning:ibis',
    "ignore:.*'_UnionGenericAlias' is deprecated:DeprecationWarning",
    "ignore:.*Passing a BlockManager to DataFrame:DeprecationWarning",
    "ignore:.*The default coalesce behavior of left join will change:DeprecationWarning",
    "ignore: unclosed <socket.socket",
    "ignore:.*The distutils package is deprecated and slated for removal in Python 3.12:DeprecationWarning:pyspark",
    "ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning",
    "ignore:.*is_datetime64tz_dtype is deprecated and will be removed in a future version.*:DeprecationWarning:pyspark",
    "ignore:.*The copy keyword is deprecated and will be removed in a future version.*:Warning:pyspark",
    "ignore:.*Python binding for RankQuantileOptions not exposed:RuntimeWarning:pyarrow",
    "ignore:.*pandas only supports SQLAlchemy:UserWarning:sqlframe",
    "ignore:.*numpy.core is deprecated and has been renamed to numpy._core.*:DeprecationWarning:sqlframe",
    "ignore:.*__array__ implementation doesn't accept a copy keyword, so passing copy=False failed:DeprecationWarning:modin",
    "ignore:.*np.find_common_type is deprecated:DeprecationWarning:pandas",
    "ignore:.*Specifying null_placement in RankOptions is deprecated as of 25.0.0. Specify null_placement per sort_key instead.*:FutureWarning",
    "ignore:.*'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning",
    "ignore:.*is_sparse is deprecated and will be removed in a future version.*:DeprecationWarning:pyarrow",
    "ignore:.*invalid value encountered in cast:RuntimeWarning:pandas",
    "ignore:.*The behavior of DataFrame concatenation with empty or all-NA entries is deprecated:FutureWarning",
    "ignore:.*Downcasting behavior in Series and DataFrame methods 'where', 'mask', and 'clip' is deprecated.*:FutureWarning:dask",
    "ignore:.*inplace keyword .* is deprecated*:Warning:dask",
    "ignore:.*interchange protocol is deprecated.*:DeprecationWarning",
]
xfail_strict = true
markers = ["""slow: marks tests as slow (deselect with '-m "not slow"')"""]
env = [
    "MODIN_ENGINE=python",
    "PYARROW_IGNORE_TIMEZONE=1",
    "TZ=UTC",
]

[tool.coverage.run]
plugins = ["covdefaults"]

[tool.coverage.report]
fail_under = 80
omit = [
    "src/narwhals/typing.py",
    "src/narwhals/compliant.py",
    "src/narwhals/stable/v1/typing.py",
    "src/narwhals/stable/v2/typing.py",
    "src/narwhals/this.py",
    "src/narwhals/_arrow/typing.py",
    "src/narwhals/_duckdb/typing.py",
    "src/narwhals/_spark_like/typing.py",
    "src/narwhals/_ibis/*",
    "src/narwhals/_compliant/namespace.py",
    "tests/ibis_test.py",
]
exclude_also = [
    "if sys.version_info() <",
    "if .* is Implementation.(CUDF|MODIN|PYSPARK|PYSPARK_CONNECT|IBIS)",
    "if .*.is_(cudf|modin|pyspark|pyspark_connect|ibis)",
    'if "(cudf|modin|pyspark|ibis)" in',
    "if not .*.is_pandas",
    "if is_ibis_table",
    "if MYPY",
    "except ModuleNotFoundError",
    'request.applymarker\(pytest.mark.xfail',
    "backend_version <",
    '.*._backend_version\(\) <',
    "BACKEND_VERSION <",
    'if ".*" in str\(constructor',
    'pytest.skip\(',
    'assert_never\(',
    'PANDAS_VERSION < \(',
]

[tool.mypy]
files = [
    "src",
    "tests",
    "packages/test-plugin",
]
pretty = true
strict = true
allow_redefinition = true

[[tool.mypy.overrides]]
module = [
    "cudf.*",
    "cupy.*",
    "dask.*",
    "dask_expr.*",
    "ibis.*",
    "joblib.*",
    "modin.*",
    "numpy.*",
    "pyspark.*",
    "sklearn.*",
    "sqlparse.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "narwhals._expression_parsing",
    "narwhals._utils",
    "narwhals._pandas_like.*",
    "narwhals._ibis.*",
    "narwhals._arrow.*",
    "narwhals._dask.*",
    "narwhals._spark_like.*",
]
warn_return_any = false

[tool.pyright]
pythonPlatform = "All"
reportMissingTypeArgument = "error"
reportIncompatibleMethodOverride = "error"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportPrivateImportUsage = "none"
reportUnusedExpression = "none"
typeCheckingMode = "basic"
include = [
    "src",
    "tests",
    "packages/test-plugin",
]
ignore = [
    "../.venv/",
    "../../../**/Lib",
    "../../../**/typeshed*",
]

[tool.pyright.defineConstant]
MYPY = false

[tool.pyrefly]
search-path = [
    "src",
    ".",
]
project-includes = ["tests"]
ignore-missing-imports = [
    "cudf.*",
    "cupy.*",
    "dask.*",
    "dask_expr.*",
    "joblib.*",
    "modin.*",
    "pyspark.*",
    "sklearn.*",
    "sqlparse.*",
]
