[project]
name = "djangorestframework-stubs"
version = "3.18.1"
requires-python = ">=3.11"
description = "PEP-484 stubs for django-rest-framework"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Framework :: Django",
]
dependencies = [
    "django-stubs>=6.1.0",
    "typing-extensions>=4.0",
    "types-PyYAML",
]

[[project.authors]]
name = "Maksim Kurnikov"
email = "maxim.kurnikov@gmail.com"

[[project.maintainers]]
name = "Marti Raudsepp"
email = "marti@juffo.org"

[[project.maintainers]]
name = "Nikita Sobolev"
email = "mail@sobolevn.me"

[project.urls]
Homepage = "https://github.com/typeddjango/djangorestframework-stubs"
Funding = "https://github.com/sponsors/typeddjango"
"Release notes" = "https://github.com/typeddjango/djangorestframework-stubs/releases"

[project.optional-dependencies]
compatible-mypy = [
    "mypy>=1.13,<2.4",
    "django-stubs[compatible-mypy]",
]
coreapi = ["coreapi>=2.0.0"]
markdown = ["types-Markdown>=0.1.5"]
requests = ["types-requests"]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-mypy-plugins==4.0.3",
    "djangorestframework==3.18.0",
    "django==5.2.*; python_version < '3.12'",
    "django==6.1.*; python_version >= '3.12'",
    "types-pytz",
    "types-requests",
    "types-Pygments",
    "types-pyyaml",
    "django-stubs[compatible-mypy] @ git+https://github.com/typeddjango/django-stubs",
    "django-stubs-ext @ git+https://github.com/typeddjango/django-stubs#subdirectory=ext",
    "djangorestframework-stubs[compatible-mypy,coreapi,markdown,requests]",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = [
    "rest_framework-stubs",
    "mypy_drf_plugin",
]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
    "--tb=native",
    "-s",
    "-v",
    "--cache-clear",
    "--mypy-extension-hook=scripts.tests_extension_hook.django_plugin_hook",
    "--mypy-ini-file=mypy.ini",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "FURB",
    "INP",
    "W",
    "I",
    "ISC001",
    "ISC002",
    "UP",
    "TID251",
    "PYI",
    "RUF100",
    "PGH004",
    "PGH003",
    "RET504",
    "RET505",
    "RET506",
    "RET507",
    "RET508",
    "RUF",
    "TC",
]
ignore = [
    "PYI021",
    "PYI041",
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "B",
    "E501",
    "E741",
    "E743",
    "F403",
    "F405",
    "F822",
    "F821",
]
"rest_framework-stubs/compat.pyi" = ["PYI042"]
"tests/assert_type/*.py" = [
    "RUF012",
    "F821",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api."_typeshed.Self"]
msg = "Use typing_extensions.Self (PEP 673) instead."

[tool.ruff.lint.isort]
split-on-trailing-comma = false
extra-standard-library = ["_typeshed"]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "rest_framework-stubs",
    "tests",
]
exclude = [
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".idea",
]
