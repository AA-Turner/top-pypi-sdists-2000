[project]
name = "django-stubs"
version = "6.0.9"
description = "Mypy stubs for Django"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
]
dependencies = [
    "django",
    "django-stubs-ext>=6.0.2",
    "tomli; python_version < '3.11'",
    "types-pyyaml",
    "typing-extensions>=4.11.0",
]

[[project.authors]]
name = "Maksim Kurnikov"
email = "maxim.kurnikov@gmail.com"

[[project.maintainers]]
name = "Marti Raudsepp"
email = "marti@juffo.org"

[[project.maintainers]]
name = "Nikita Sobolev"
email = "mail@sobolevn.me"

[[project.maintainers]]
name = "Petter Friberg"
email = "petter_friberg@hotmail.com"

[[project.maintainers]]
name = "Adam Johnson"
email = "me@adamj.eu"

[project.optional-dependencies]
compatible-mypy = ["mypy>=1.13,<2.4"]
oracle = ["oracledb"]
redis = [
    "redis",
    "types-redis",
]

[project.urls]
Homepage = "https://github.com/typeddjango/django-stubs"
Funding = "https://github.com/sponsors/typeddjango"
"Release notes" = "https://github.com/typeddjango/django-stubs/releases"

[dependency-groups]
tests = [
    "pytest==9.1.1",
    "pytest-mypy-plugins==4.0.3",
    "pytest-shard==0.1.2",
    "pytest-xdist==3.8.0",
    "django==5.2.16; python_version < '3.12'",
    "django==6.0.7; python_version >= '3.12'",
    "mysqlclient==2.2.8",
    "psycopg[binary]==3.3.4",
    "psycopg2-binary==2.9.12",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "django-stubs[compatible-mypy,oracle,redis]",
]
pyright = ["pyright==1.1.411"]
pyrefly = [
    "pyrefly==1.2.0",
    "psycopg2-binary",
]
ty = [
    "ty==0.0.66",
    "psycopg2-binary",
]

[[dependency-groups.dev]]
include-group = "tests"

[[dependency-groups.dev]]
include-group = "pyright"

[[dependency-groups.dev]]
include-group = "pyrefly"

[[dependency-groups.dev]]
include-group = "ty"

[tool.uv.sources.django-stubs]
workspace = true

[tool.uv.sources.django-stubs-ext]
workspace = true

[tool.uv.workspace]
members = ["ext"]

[tool.uv.build-backend]
module-name = [
    "django-stubs",
    "mypy_django_plugin",
]
module-root = ""

[tool.pyright]
include = ["tests/assert_type/"]
typeCheckingMode = "strict"
reportImplicitStringConcatenation = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
enableTypeIgnoreComments = false
reportCallInDefaultInitializer = "none"
reportMissingSuperCall = "none"
reportPrivateUsage = "none"
reportMissingModuleSource = "none"

[tool.pyrefly]
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
unused-ignore = true

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.codespell]
ignore-words-list = "aadd,acount,asend,indentity,nam"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "FURB",
    "INP",
    "W",
    "I",
    "ISC001",
    "ISC002",
    "UP",
    "TID251",
    "PYI",
    "RUF100",
    "PGH004",
    "PGH003",
    "RET504",
    "RET505",
    "RET506",
    "RET507",
    "RET508",
    "RUF",
    "TC",
]
ignore = [
    "PYI021",
    "PYI041",
    "PYI043",
]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = [
    "B",
    "E501",
    "E741",
    "E743",
    "F403",
    "F405",
    "F822",
    "F821",
]
"tests/*.py" = [
    "INP001",
    "PGH003",
    "RUF012",
]
"ext/tests/*.py" = ["INP001"]
"setup.py" = ["INP001"]
"tests/assert_type/*.py" = [
    "B",
    "UP013",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api."_typeshed.Self"]
msg = "Use typing_extensions.Self (PEP 673) instead. If you type a metaclass, add a noqa"

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing.assert_type"]
msg = "Only available in Python 3.11 and above. Use `typing_extensions.assert_type` instead."

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing.Self"]
msg = "Only available in Python 3.11 and above. Use `typing_extensions.Self` instead."

[tool.ruff.lint.flake8-tidy-imports.banned-api."typing.TypeVar"]
msg = "Only support the `default` parameter in Python 3.13 and above. Use `typing_extensions.TypeVar` instead."

[tool.ruff.lint.isort]
known-first-party = [
    "django_stubs_ext",
    "mypy_django_plugin",
]
required-imports = ["from __future__ import annotations"]
split-on-trailing-comma = false

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
