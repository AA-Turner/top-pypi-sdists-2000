[build-system]
requires = ["hatchling", "versioningit"]
build-backend = "hatchling.build"

[project]
name = "scramp"
authors = [{ name = "The Contributors" }]
description = "An implementation of the SCRAM protocol."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["SCRAM", "authentication", "SASL"]
license = { text = "MIT No Attribution" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]
dependencies = ["asn1crypto >= 1.5.1"]
dynamic = ["version"]

[project.urls]
Homepage = "https://codeberg.org/tlocke/scramp"

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]

[tool.versioningit.vcs]
method = "git"
default-tag = "0.0.0"

[tool.ruff.lint]
extend-select = ["E501", "I"]

[tool.ruff.lint.isort]
known-first-party = ["scramp"]

[tool.tox]
requires = ["tox>=4.19"]
envlist = ["py"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
allowlist_externals = ["rm"]
commands = [
  [
    "ruff",
    "format",
    "--check",
    ".",
  ],
  [
    "validate-pyproject",
    "pyproject.toml",
  ],
  [
    "pytest",
    "-v",
    "-x",
    "-W error",
    "test",
  ],
  [
    "rm",
    "-rf",
    "dist",
  ],
  [
    "python",
    "-m",
    "build",
  ],
  [
    "twine",
    "check",
    "dist/*",
  ],
]
deps = [
  "pytest",
  "pytest-mock",
  "ruff",
  "docutils",
  "build",
  "twine",
  "validate-pyproject",
]
