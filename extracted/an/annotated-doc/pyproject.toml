[project]
name = "annotated-doc"
dynamic = []
license = "MIT"
license-files = [
    "LICENSE",
]
description = "Document parameters, class attributes, return types, and variables inline, with Annotated."
readme = "README.md"
authors = [
    { name = "Sebastián Ramírez", email = "tiangolo@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []
version = "0.0.5"

[project.urls]
Homepage = "https://github.com/fastapi/annotated-doc"
Documentation = "https://github.com/fastapi/annotated-doc"
Repository = "https://github.com/fastapi/annotated-doc"
Issues = "https://github.com/fastapi/annotated-doc/issues"
Changelog = "https://github.com/fastapi/annotated-doc/release-notes.md"

[dependency-groups]
dev = [
    { include-group = "tests" },
    "prek>=0.2.24,<1.0.0",
    "zizmor>=1.2.0",
]
tests = [
    "coverage[toml]>=7.6.1",
    "mypy==1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.15.14",
    "smokeshow>=0.5.0",
    "ty>=0.0.25",
    "typer>=0.16.1",
]

[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
xfail_strict = true
junit_family = "xunit2"

[tool.coverage.run]
parallel = true
data_file = "coverage/.coverage"
source = [
    "src/annotated_doc",
    "tests",
]
context = "${CONTEXT}"
dynamic_context = "test_function"
relative_files = true

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
    "W191",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "file"
path = "src/annotated_doc/__init__.py"

[tool.pdm.build]
source-includes = [
    "tests/",
    "scripts/",
]

[tool.ty.terminal]
error-on-warning = true

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "coverage/",
    "htmlcov/",
]

[tool.typos.default]
extend-ignore-re = [
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
]

[tool.typos.default.extend-identifiers]
alls = "alls"
