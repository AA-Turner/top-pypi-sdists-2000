[project]
name = "graphql-core"
version = "3.3.0"
description = "GraphQL-core is a Python port of GraphQL.js, the JavaScript reference implementation for GraphQL."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["graphql"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = []

[[project.authors]]
name = "Christoph Zwerschke"
email = "cito@online.de"

[project.urls]
Homepage = "https://github.com/graphql-python/graphql-core"
Repository = "https://github.com/graphql-python/graphql-core"
Documentation = "https://graphql-core-3.readthedocs.io/"
Changelog = "https://github.com/graphql-python/graphql-core/releases"

[dependency-groups]
test = [
    "anyio>=4.15,<5",
    "pytest>=9.1,<10",
    "pytest-benchmark>=5.3,<6",
    "pytest-cov>=7.1,<8",
    "pytest-describe>=3.2,<4",
    "pytest-timeout>=2.4,<3",
    "pytest-codspeed>=5",
    "tox>=4.64,<5",
]
lint = [
    "ruff>=0.16.9,<0.17",
    "mypy>=2.3.1,<3",
    "bump-my-version>=1.5.1,<2",
    "typing-extensions>=4.16; python_version<'3.11'",
]
doc = [
    "sphinx>=9.1,<10; python_version>='3.12'",
    "sphinx_rtd_theme>=3.1,<4; python_version>='3.12'",
]

[tool.uv]
link-mode = "copy"

[tool.uv.build-backend]
module-name = "graphql"
module-root = "src"
source-include = [
    "LICENSE",
    "README.md",
    "tests/**",
    "docs/**",
    ".editorconfig",
    ".readthedocs.yaml",
    "tox.ini",
    "CODEOWNERS",
    "SECURITY.md",
]
source-exclude = ["docs/_build/**"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM",
    "D",
    "DTZ",
    "E",
    "EM",
    "ERA",
    "EXE",
    "F",
    "FBT",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "N",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "FURB",
    "RUF",
    "S",
    "SLF",
    "SIM",
    "T10",
    "T20",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "A005",
    "ANN401",
    "COM812",
    "D105",
    "D107",
    "D203",
    "D213",
    "D400",
    "D415",
    "D401",
    "FBT001",
    "FBT002",
    "FBT003",
    "ISC001",
    "PLC0415",
    "PGH003",
    "PLR2004",
    "PYI034",
    "TID252",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["I001"]
"src/graphql/execution/*" = [
    "ARG002",
    "BLE001",
]
"src/graphql/language/ast.py" = ["D101"]
"src/graphql/language/parser.py" = ["RSE102"]
"src/graphql/type/introspection.py" = [
    "ANN001",
    "ANN003",
    "ANN204",
    "ANN205",
    "N803",
]
"src/graphql/utilities/get_introspection_query.py" = [
    "D101",
    "N815",
]
"src/graphql/utilities/type_info.py" = ["D102"]
"src/graphql/validation/rules/*" = ["D102"]
"src/graphql/validation/validation_context.py" = ["D102"]
"tests/*" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "B011",
    "B904",
    "C901",
    "D100",
    "D101",
    "D102",
    "D103",
    "EM101",
    "EM102",
    "N802",
    "N803",
    "N806",
    "N815",
    "N816",
    "PLR0915",
    "PT015",
    "RUF012",
    "S101",
    "S301",
    "TRY002",
    "TRY301",
]
"tests/star_wars_schema.py" = [
    "A002",
    "ERA001",
]
"tests/test_docs.py" = ["S102"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"

[tool.ruff.lint.mccabe]
max-complexity = 50

[tool.ruff.lint.pylint]
max-args = 15
max-branches = 50
max-returns = 25
max-statements = 125

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.coverage.run]
branch = true
source = [
    "src",
    "tests",
]
omit = [
    "*/conftest.py",
    "*/test_*_fuzz.py",
    "*/assert_valid_name.py",
    "*/cached_property.py",
    "*/character_classes.py",
    "*/is_iterable.py",
    "*/subscription/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError:",
    "# Python <",
    'sys\.version_info <',
    "raise NotImplementedError",
    "assert False,",
    '\s+next\($',
    "if MYPY:",
    "if TYPE_CHECKING:",
    '^\s+\.\.\.$',
    '^\s+pass$',
    ': \.\.\.$',
]
ignore_errors = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = [
    "graphql.type.introspection",
    "tests.*",
]
disallow_untyped_defs = false

[tool.pyright]
reportArgumentType = false
reportAssignmentType = false
reportAttributeAccessIssue = false
reportIncompatibleVariableOverride = false
reportInvalidTypeForm = false
reportMissingModuleSource = false
reportMissingTypeArgument = false
reportReturnType = false
reportTypedDictNotRequiredAccess = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnnecessaryIsInstance = false
reportUnknownVariableType = false
ignore = ["**/test_*"]

[tool.pylint.basic]
max-module-lines = 2000

[tool.pylint.messages_control]
disable = [
    "method-hidden",
    "missing-module-docstring",
    "redefined-outer-name",
    "unused-variable",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "--benchmark-disable"
python_classes = "PyTest*"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = "100"
filterwarnings = "ignore::pytest.PytestConfigWarning"
testpaths = ["tests"]

[tool.bumpversion]
current_version = "3.3.0"
commit = false
tag = false
parse = '''
(?x)
    (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
    (?:(?P<release>a|b|rc)(?P<build>\d+))?
'''
serialize = [
    "{major}.{minor}.{patch}{release}{build}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
values = [
    "a",
    "b",
    "rc",
    "final",
]
optional_value = "final"

[[tool.bumpversion.files]]
filename = "src/graphql/version.py"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "docs/conf.py"
search = 'version = release = "{current_version}"'
replace = 'version = release = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "{current_version} of GraphQL-core"
replace = "{new_version} of GraphQL-core"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '^version = "{current_version}"'
replace = 'version = "{new_version}"'

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
