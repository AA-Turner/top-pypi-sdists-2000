[project]
dependencies = [
  "httpx>=0.27.0",
]
description = "Thin proxy server for Claude Code and Laminar tracing"
name = "lmnr-claude-code-proxy"
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.0"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]

# poetry would auto-generate these based on requires-python, but other build
# systems don't, so we need to specify them manually.
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[dependency-groups]
dev = [
  "maturin>=1.15.0",
]

[build-system]
build-backend = "maturin"
requires = ["maturin>=1.0,<2.0"]

[tool.maturin]
features = ["python"]
manifest-path = "bin/Cargo.toml"
