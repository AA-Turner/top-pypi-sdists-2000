[project]
name = "e2b"
version = "2.62.0"
description = "E2B SDK that give agents cloud environments"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.8.2",
    "wcmatch>=10.1,<12",
    "protobuf-py>=0.6.0,<0.7",
    "httpx>=0.27.0,<1.0.0",
    "h2>=4.4.1,<5",
    "attrs>=23.2.0",
    "packaging>=24.1",
    "typing-extensions>=4.10.0",
    "rich>=14.0.0",
    "connectrpc>=0.12.1,<0.13",
    "pyqwest>=0.12.0,<0.13",
    "e2b-dockerfile-utils>=0.1.0,<0.2",
]

[[project.authors]]
name = "e2b"
email = "hello@e2b.dev"

[project.urls]
Homepage = "https://e2b.dev/?utm_source=pypi&utm_medium=referral&utm_campaign=package_homepage&utm_content=e2b"
Repository = "https://github.com/e2b-dev/e2b/tree/main/packages/python-sdk"
"Bug Tracker" = "https://github.com/e2b-dev/e2b/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-xdist>=3.3.1,<4",
    "python-dotenv>=1.0.0,<2",
    "pytest-dotenv>=0.5.2,<0.6",
    "pytest-asyncio>=1.3.0,<2",
    "ruff>=0.11.12,<0.12",
    "pytest-timeout>=2.4.0,<3",
    "ty>=0.0.15,<0.0.16",
]
codegen = [
    "black==26.10.1",
    "e2b-openapi-python-client==0.26.2",
    "datamodel-code-generator==0.64.0",
    "protoc-gen-connectrpc==0.12.1",
    "protoc-gen-py==0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["e2b"]
module-root = ""

[tool.uv.sources.e2b-dockerfile-utils]
path = "../dockerfile-utils-python"
editable = true

[tool.basedpyright]
reportInconsistentOverload = false

[tool.ty.rules]
invalid-overload = "ignore"
no-matching-overload = "ignore"

[[tool.ty.overrides]]
include = ["e2b/api/client/models/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["e2b/volume/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
